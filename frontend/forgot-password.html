<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | CareerPath</title>
    <meta name="description" content="Recover access to your CareerPath account." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="login-page">
    <main class="auth-page">
        <div class="container">
            <section class="auth-form-container">
                <div class="auth-form-card">
                    <a href="login.html" class="logo"><i class="fas fa-briefcase"></i> CareerPath</a>
                    <div id="request-view">
                        <h1>Forgot password?</h1>
                        <p class="auth-subtitle">Enter your account email and we’ll send a secure reset link.</p>
                        <form id="request-reset-form">
                            <div class="form-group">
                                <label for="reset-email">Email address</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-envelope" aria-hidden="true"></i>
                                    <input id="reset-email" type="email" autocomplete="email" required placeholder="you@example.com">
                                </div>
                            </div>
                            <button class="btn-primary btn-large btn-full" type="submit">Send reset link</button>
                        </form>
                    </div>
                    <div id="password-view" hidden>
                        <h1>Choose a new password</h1>
                        <p class="auth-subtitle">Use at least 8 characters for your new password.</p>
                        <form id="new-password-form">
                            <div class="form-group">
                                <label for="new-password">New password</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-lock" aria-hidden="true"></i>
                                    <input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="confirm-password">Confirm password</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-lock" aria-hidden="true"></i>
                                    <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
                                </div>
                            </div>
                            <button class="btn-primary btn-large btn-full" type="submit">Update password</button>
                        </form>
                    </div>
                    <p id="reset-status" class="auth-subtitle" role="status" aria-live="polite"></p>
                    <p class="auth-footer"><a href="login.html">Back to log in</a></p>
                </div>
            </section>
        </div>
    </main>
    <script src="../js/main.js"></script>
    <script src="../js/password-reset.js"></script>
</body>
</html>
